<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8E5431">
<title>离线 | 莊子數位典藏</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!--
  Service Worker 的离线兜底页（public/sw.js 的 OFFLINE_URL）。
  必须自包含：不引用任何构建产物脚本、网络字体或外链样式，离线时才能保证渲染。
  配色取自 src/lib/theme.ts 的「宣纸」「夜读」两套主题。
-->
<style>
:root{--bg:#FAF8F4;--card:#FFFFFF;--text:#231C14;--sub:#665747;--accent:#8E5431;--border:#E8DFCF;--btn:#FFFFFF;color-scheme:light}
:root.dark{--bg:#161412;--card:#24201A;--text:#EAE4D9;--sub:#A69D8E;--accent:#D49B6A;--border:#38322A;--btn:#161412;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,SimSun,serif;line-height:1.8}
main{width:100%;max-width:34rem;text-align:center}
.seal{display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border:2px solid var(--accent);border-radius:.4rem;color:var(--accent);font-size:1.75rem;margin-bottom:1.25rem}
h1{font-size:1.75rem;margin:0 0 .5rem;letter-spacing:.2em;font-weight:700}
p{margin:.25rem 0;color:var(--sub)}
.quote{margin-top:1rem;font-size:.95rem}
button{margin-top:1.5rem;padding:.6rem 1.6rem;font:inherit;color:var(--btn);background:var(--accent);border:0;border-radius:.5rem;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
section{margin-top:2.25rem;text-align:left}
h2{font-size:1rem;margin:0 0 .5rem;color:var(--sub);font-weight:400;text-align:center}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:.6rem;background:var(--card);overflow:hidden}
li+li{border-top:1px solid var(--border)}
li a{display:block;padding:.65rem 1rem;color:var(--text);text-decoration:none}
li a:hover{color:var(--accent)}
</style>
<script>
try{var t=localStorage.getItem("siteTheme");if(t==="yedu"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.classList.add("dark");document.querySelector('meta[name="theme-color"]').content="#14120F"}}catch(e){}
</script>
</head>
<body>
<main>
  <div class="seal" aria-hidden="true">莊</div>
  <h1>離線</h1>
  <p>当前没有网络连接，此页尚未保存到本机。</p>
  <p class="quote">「泉涸，鱼相与处于陆……不如相忘于江湖。」</p>
  <button type="button" id="retry">重新连接</button>
  <section id="cached" hidden aria-labelledby="cached-title">
    <h2 id="cached-title">以下页面已保存，可离线阅读</h2>
    <ul id="cached-list"></ul>
  </section>
</main>
<script>
(function () {
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  // 网络恢复后自动重试当前地址
  addEventListener("online", function () { location.reload(); });

  if (!("caches" in window)) return;
  (async function () {
    var names = (await caches.keys()).filter(function (k) { return k.indexOf("zhuangzi-pages-") === 0; });
    var seen = new Set();
    var items = [];
    for (var n = 0; n < names.length; n++) {
      var cache = await caches.open(names[n]);
      var keys = await cache.keys();
      for (var i = keys.length - 1; i >= 0 && items.length < 30; i--) {
        var url = new URL(keys[i].url);
        if (url.origin !== location.origin || seen.has(url.pathname)) continue;
        if (url.pathname === location.pathname || /^\/(404|offline)\b/.test(url.pathname)) continue;
        seen.add(url.pathname);
        var title = "";
        try {
          var res = await cache.match(keys[i]);
          var m = /<title>([^<]*)<\/title>/.exec(await res.text());
          if (m) { var d = document.createElement("textarea"); d.innerHTML = m[1]; title = d.value; }
        } catch (e) {}
        items.push({ path: url.pathname, title: title || decodeURIComponent(url.pathname) });
      }
    }
    if (!items.length) return;
    var list = document.getElementById("cached-list");
    items.forEach(function (it) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = it.path;
      a.textContent = it.title;
      li.appendChild(a);
      list.appendChild(li);
    });
    document.getElementById("cached").hidden = false;
  })().catch(function () {});
})();
</script>
</body>
</html>
